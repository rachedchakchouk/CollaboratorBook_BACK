# Dependabot : mises à jour groupées, hebdomadaires (lundi 06:00, heure de Tunis).
# Les montées majeures de Spring Boot / Spring Cloud se font à la main (Spring Boot 3 :
# Java 17 et javax -> jakarta) ; les alertes et correctifs de sécurité restent actifs.
version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/botRH"
      - "/businessMS"
      - "/cloud-gateway"
      - "/eureka-server"
      - "/securityMs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Tunis"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dépendances"]
    groups:
      securite-maven:
        applies-to: security-updates
        patterns: ["*"]
      spring:
        applies-to: version-updates
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
        update-types: ["minor", "patch"]
      maven-mineures-correctives:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
